prompt: 日本語の縦長インフォグラフィック。タイトルは「情報を、信頼できる一枚へ」。高校入試やバイク趣味などのミニプロジェクト、出典と検証状態を持つ知識、同じcharacter IDを保つ頭身変更と複数キャラで共有できるitem、共通から今回の指示までのプロンプト層とハッシュ付きsidecar、生成原画を公開せずPythonでロゴ透かし・SNS縮小圧縮・Web寸法維持・メタデータ検査を行う工程を説明する。投稿は手動で、投稿後に公開先を記録することを明示する。読みやすい余白と明確な視線誘導を持ち、原画やプロンプト全文を表示しない。
